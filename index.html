<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMA — Operation Millionaire Athletes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   OMA — Operation Millionaire Athletes
   Athlete Portal prototype. Single file: HTML + CSS + JS.
   ============================================================ */

:root{
  --ink:#2E0F26;
  --plum:#6B2350;
  --plum-soft:#9A5A80;
  --gold:#C1972F;
  --gold-lite:#EBD7A0;
  --paper:#FBF8F7;
  --card:#FFFFFF;
  --line:#EADFE4;
  --mauve:#8A7180;
  --jade:#2F6B58;
  --rust:#A34A4A;

  --r-sm:8px;
  --r-md:14px;
  --r-lg:22px;

  --sidebar:248px;
  --shell:1180px;

  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.shell{max-width:var(--shell);margin:0 auto;padding:0 18px}

.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(251,248,247,.92);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:var(--shell);margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;gap:12px;
}
.mark{display:flex;align-items:center;gap:9px;margin-right:auto;text-decoration:none}
.mark-badge{
  width:32px;height:32px;border-radius:9px;flex:none;
  background:linear-gradient(150deg,var(--plum),var(--ink));
  border:1px solid rgba(193,151,47,.55);
  display:grid;place-items:center;
  color:var(--gold-lite);font-family:var(--f-display);font-size:14px;font-weight:600;
  letter-spacing:.02em;
}
.mark-text{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.mark-text span{color:var(--plum-soft);font-weight:400}

.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:var(--plum);position:relative;border:1px solid transparent;
}
.icon-btn:hover{background:#fff;border-color:var(--line)}
.dot{
  position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;
  background:var(--gold);border:1.5px solid var(--paper);
}
.avatar-btn{
  width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;
  border:1.5px solid var(--gold);
  background:linear-gradient(150deg,var(--plum-soft),var(--plum));
  display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;
}
.searchwrap{display:none}
@media(min-width:860px){
  .searchwrap{
    display:flex;align-items:center;gap:8px;flex:1;max-width:320px;
    background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 11px;
    color:var(--mauve);
  }
  .searchwrap input{border:0;background:none;outline:none;width:100%;font-size:14px}
}

/* ---------- sidebar ---------- */
.sidebar{display:none}
@media(min-width:1000px){
  body{padding-bottom:40px}
  .sidebar{
    display:block;position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);
    background:linear-gradient(175deg,var(--ink),var(--plum) 130%);
    padding:18px 14px;overflow-y:auto;z-index:50;
  }
  .sidebar .mark{margin:4px 6px 22px}
  .sidebar .mark-text{color:#fff}
  .sidebar .mark-text span{color:var(--gold-lite)}
  .layout{padding-left:var(--sidebar)}
  .topbar-in,.shell{max-width:calc(var(--shell) - 120px)}
}
.rolepill{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:rgba(255,255,255,.07);border:1px solid rgba(235,215,160,.28);
  border-radius:12px;padding:9px 11px;margin:0 0 18px;color:#fff;
}
.rolepill:hover{background:rgba(255,255,255,.12)}
.rolepill small{display:block;font-size:11px;color:rgba(235,215,160,.7)}
.rolepill b{font-size:14px;font-weight:600}
.rolepill svg{margin-left:auto;color:var(--gold-lite);flex:none}
.rolepill-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.rolebtn{display:flex}
@media(min-width:1000px){.rolebtn{display:none}}

.nav-group{margin-bottom:20px}
.nav-label{
  font-size:11px;color:rgba(235,215,160,.55);letter-spacing:.04em;
  padding:0 10px 7px;font-weight:500;
}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 10px;border-radius:10px;color:rgba(255,255,255,.72);
  font-size:14.5px;font-weight:500;margin-bottom:2px;
}
.nav-item svg{flex:none;opacity:.8}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item[aria-current="page"]{
  background:rgba(193,151,47,.16);color:#fff;
  box-shadow:inset 2px 0 0 var(--gold);
}
.nav-item[aria-current="page"] svg{opacity:1;color:var(--gold-lite)}
.nav-count{
  margin-left:auto;font-size:11.5px;background:var(--gold);color:var(--ink);
  border-radius:20px;padding:1px 7px;font-weight:600;
}

/* ---------- bottom bar (mobile) ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
@media(min-width:1000px){.tabbar{display:none}}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--mauve);font-size:10.5px;font-weight:500;border-radius:10px;
}
.tab[aria-current="page"]{color:var(--plum)}
.tab[aria-current="page"] svg{color:var(--gold)}

/* ---------- generic ---------- */
.view{padding:20px 0 40px;animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-family:var(--f-display);font-size:29px;letter-spacing:-.02em}
.page-head p{color:var(--mauve);font-size:14px;max-width:56ch}
.page-head .grow{margin-right:auto}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px;margin-bottom:16px;
}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-head h2{font-size:16px;letter-spacing:-.01em}
.panel-head .grow{margin-right:auto}
.panel-note{color:var(--mauve);font-size:13.5px;margin-top:-6px;margin-bottom:14px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:10px;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  transition:transform .12s ease,background .15s ease,border-color .15s ease;
}
.btn:hover{border-color:var(--plum-soft)}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--plum);color:#fff;border-color:var(--plum)}
.btn-primary:hover{background:#571c41;border-color:#571c41}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),#a87f22);
  color:#fff;border-color:#a87f22;
}
.btn-gold:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--plum);padding:9px 10px}
.btn-ghost:hover{background:#fff;border-color:var(--line)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn-row{display:flex;flex-wrap:wrap;gap:9px}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600;
  background:#F4EDF1;color:var(--plum);
}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.neutral{background:#F2EFF1;color:var(--mauve)}
.chip.gold{background:#FAF2DE;color:#8A6A16}
.chip.jade{background:#E9F2EF;color:var(--jade)}
.chip.rust{background:#F8EDED;color:var(--rust)}
.chip.plum{background:#F4EDF1;color:var(--plum)}
.chip.plain::before{display:none}

.hint{color:var(--mauve);font-size:13px}
.empty{
  text-align:center;padding:34px 18px;color:var(--mauve);
  border:1px dashed var(--line);border-radius:var(--r-md);background:#fff;
}
.empty h3{font-family:var(--f-display);font-size:19px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:14px;max-width:42ch;margin:0 auto 14px}

/* ---------- player card ---------- */
.playercard{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:
    radial-gradient(120% 100% at 88% 8%,rgba(193,151,47,.30),transparent 55%),
    linear-gradient(160deg,#3E1533,var(--ink) 55%,#1E0918);
  border:1px solid rgba(193,151,47,.5);
  color:#fff;padding:22px;margin-bottom:16px;
  animation:cardin .55s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.playercard::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(235,215,160,.16) 46%,transparent 58%);
}
.pc-top{display:flex;gap:16px;align-items:flex-start;position:relative;z-index:1}
.pc-portrait{
  width:76px;height:76px;flex:none;border-radius:16px;overflow:hidden;
  border:1.5px solid rgba(235,215,160,.6);
  background:linear-gradient(150deg,var(--plum-soft),var(--plum));
  display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#fff;
}
.pc-name{font-family:var(--f-display);font-size:30px;letter-spacing:-.025em;line-height:1.05}
.pc-meta{color:rgba(255,255,255,.72);font-size:13.5px;margin-top:5px}
.pc-num{
  position:absolute;top:14px;right:18px;z-index:1;
  font-family:var(--f-display);font-size:62px;font-weight:600;line-height:1;
  color:transparent;-webkit-text-stroke:1.4px rgba(235,215,160,.5);
}
.pc-stats{
  position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);
}
.pc-stat b{display:block;font-family:var(--f-display);font-size:23px;font-weight:600;letter-spacing:-.02em}
.pc-stat span{font-size:12px;color:rgba(255,255,255,.62)}
.pc-progress{
  position:relative;z-index:1;margin-top:18px;display:flex;align-items:center;gap:13px;
}
.ring{width:52px;height:52px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(255,255,255,.16)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring text{fill:#fff;font-family:var(--f-ui);font-size:15px;font-weight:600;text-anchor:middle}
.pc-progress p{font-size:13.5px;color:rgba(255,255,255,.78);line-height:1.4}
.pc-progress b{color:#fff;display:block;font-size:14.5px;font-weight:600}

/* ---------- money strip ---------- */
.strip{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;margin-bottom:16px;
}
.strip div{padding:15px 16px;border-right:1px solid var(--line)}
.strip div:last-child{border-right:0}
.strip b{display:block;font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.strip span{font-size:12.5px;color:var(--mauve)}
@media(max-width:520px){
  .strip b{font-size:19px}
  .strip div{padding:12px 11px}
}

/* ---------- lists ---------- */
.rows{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff}
.row{
  display:flex;align-items:center;gap:13px;padding:13px 15px;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row .grow{margin-right:auto;min-width:0}
.row b{display:block;font-size:14.5px;font-weight:600}
.row small{color:var(--mauve);font-size:12.5px}
.row-stack{flex-wrap:wrap}

.tick{
  width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line);
  display:grid;place-items:center;color:transparent;background:#fff;
}
.tick.done{background:var(--jade);border-color:var(--jade);color:#fff}

.brandmark{
  width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-family:var(--f-display);font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(145deg,var(--plum-soft),var(--plum));
}
.brandmark.g{background:linear-gradient(145deg,var(--gold),#96701c)}
.brandmark.i{background:linear-gradient(145deg,#4d6b7d,#2d4353)}

/* ---------- quick actions ---------- */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media(max-width:600px){.quick{grid-template-columns:1fr 1fr 1fr;gap:8px}}
.quick button{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.25;
}
.quick button:hover{border-color:var(--plum-soft)}
.quick svg{color:var(--gold)}

/* ---------- profile fields ---------- */
.fields{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff}
.field{
  display:grid;grid-template-columns:190px 1fr auto;gap:14px;align-items:center;
  padding:11px 15px;border-bottom:1px solid var(--line);
}
.field:last-child{border-bottom:0}
.field dt{color:var(--mauve);font-size:13.5px}
.field dd{margin:0;font-size:14.5px;font-weight:500}
.field .lock{color:var(--mauve)}
@media(max-width:700px){
  .field{grid-template-columns:1fr auto;gap:2px 10px;padding:11px 14px}
  .field dt{grid-column:1/-1;font-size:12.5px}
}
.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.social{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:#fff}
.social b{display:block;font-family:var(--f-display);font-size:21px;letter-spacing:-.02em}
.social span{font-size:12.5px;color:var(--mauve)}

/* ---------- media kit ---------- */
.kit-shell{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:960px){.kit-shell{grid-template-columns:1fr 260px;align-items:start}}
.templates{display:flex;gap:10px;flex-wrap:wrap}
.tpl{
  border:1.5px solid var(--line);border-radius:var(--r-md);padding:11px 13px;
  background:#fff;text-align:left;min-width:118px;
}
.tpl[aria-pressed="true"]{border-color:var(--gold);background:#FDFAF2}
.tpl b{display:block;font-size:13.5px}
.tpl span{font-size:12px;color:var(--mauve)}
.tpl-swatch{height:34px;border-radius:7px;margin-bottom:8px}
.tpl-swatch.editorial{background:linear-gradient(120deg,#fff 50%,var(--plum) 50%)}
.tpl-swatch.foil{background:linear-gradient(120deg,var(--ink),var(--gold))}
.tpl-swatch.clean{background:linear-gradient(120deg,#F4EDF1,#fff)}

.kit{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;
}
.kit-head{
  padding:26px 24px 22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#3E1533,var(--ink));
}
.kit.foil .kit-head{background:linear-gradient(150deg,var(--ink),#5c4413)}
.kit.clean .kit-head{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.kit.clean .kit-eyebrow{color:var(--plum-soft)}
.kit.clean .kit-sub{color:var(--mauve)}
.kit-eyebrow{font-size:12.5px;color:var(--gold-lite);letter-spacing:.03em;margin-bottom:7px}
.kit-name{font-family:var(--f-display);font-size:38px;letter-spacing:-.03em;line-height:1}
@media(max-width:520px){.kit-name{font-size:28px}}
.kit-sub{color:rgba(255,255,255,.75);font-size:14px;margin-top:8px}
.kit-body{padding:22px 24px 26px;display:grid;gap:22px}
.kit-sec h4{font-family:var(--f-display);font-size:17px;margin-bottom:9px;letter-spacing:-.01em}
.kit-sec p{font-size:14.5px;line-height:1.6;max-width:66ch;color:#3d2437}
.kit-reach{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
.kit-reach div{border-top:2px solid var(--gold);padding-top:8px}
.kit-reach b{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:-.02em}
.kit-reach span{font-size:12px;color:var(--mauve)}
.kit-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.kit-list li{display:flex;gap:9px;font-size:14.5px;align-items:flex-start}
.kit-list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none}
.kit-foot{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--line);padding:16px 24px;background:#FDFBFA;
}
.qr{width:64px;height:64px;flex:none;border-radius:9px;background:
  repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/13px 13px;
  border:3px solid #fff;box-shadow:0 0 0 1px var(--line);
}
.kit-foot b{display:block;font-size:14px}
.kit-foot small{color:var(--mauve);font-size:12.5px}

/* ---------- gallery ---------- */
.folders{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.folder{
  border:1px solid var(--line);background:#fff;border-radius:20px;
  padding:7px 14px;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--mauve);
}
.folder[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff;
  text-align:left;display:flex;flex-direction:column;
}
.tile-img{
  aspect-ratio:4/5;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.5);
}
.tile-img.a{background:linear-gradient(150deg,#5B1F45,#2E0F26)}
.tile-img.b{background:linear-gradient(150deg,#8A6A16,#3a2c09)}
.tile-img.c{background:linear-gradient(150deg,#9A5A80,#5B1F45)}
.tile-img.d{background:linear-gradient(150deg,#4d6b7d,#22333d)}
.tile-fav{
  position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.42);display:grid;place-items:center;color:#fff;
}
.tile-fav.on{color:var(--gold)}
.tile-flag{position:absolute;left:8px;bottom:8px}
.tile-meta{padding:9px 11px}
.tile-meta b{display:block;font-size:13px;font-weight:600}
.tile-meta small{color:var(--mauve);font-size:11.5px}

/* ---------- tables / trackers ---------- */
.tracker{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
.tracker th{
  text-align:left;font-size:12.5px;color:var(--mauve);font-weight:500;
  padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tracker td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.tracker tr:last-child td{border-bottom:0}
.tracker b{font-weight:600}
.tracker small{color:var(--mauve);display:block;font-size:12.5px}
.table-wrap{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.table-scroll{overflow-x:auto}
@media(max-width:760px){
  .table-scroll{display:none}
}
.cards-only{display:none}
@media(max-width:760px){.cards-only{display:block}}

.record{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px;margin-bottom:10px;
}
.record-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.record-top .grow{margin-right:auto;min-width:0}
.record-top b{display:block;font-size:15px}
.record-top small{color:var(--mauve);font-size:12.5px}
.record dl{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 11px}
.record dt{font-size:11.5px;color:var(--mauve)}
.record dd{margin:0;font-size:13.5px;font-weight:600}

/* ---------- messages ---------- */
.thread{display:grid;gap:12px;margin-bottom:16px}
.msg{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5}
.msg small{display:block;font-size:11.5px;margin-top:5px;opacity:.7}
.msg.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{background:var(--plum);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.composer{display:flex;gap:9px;align-items:flex-end}
.composer textarea{
  flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  background:#fff;resize:none;min-height:44px;max-height:130px;outline:none;font-size:14.5px;
}
.composer textarea:focus{border-color:var(--plum-soft)}

/* ---------- forms ---------- */
.form-grid{display:grid;gap:13px}
@media(min-width:640px){.form-grid.two{grid-template-columns:1fr 1fr}}
.f label{display:block;font-size:12.5px;color:var(--mauve);margin-bottom:5px}
.f input,.f select,.f textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  background:#fff;outline:none;font-size:14.5px;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--plum-soft)}
.f textarea{resize:vertical;min-height:92px;line-height:1.55}
.f.span{grid-column:1/-1}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:100;background:rgba(46,15,38,.42);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:fade .2s ease both;
}
@media(min-width:700px){.scrim{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--paper);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;
  border-radius:20px 20px 0 0;animation:slideup .28s cubic-bezier(.2,.7,.3,1) both;
}
@media(min-width:700px){.modal{border-radius:18px}}
@keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{
  position:sticky;top:0;background:var(--paper);padding:18px 20px 12px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:2;
}
.modal-head h2{font-family:var(--f-display);font-size:20px;letter-spacing:-.02em;margin-right:auto}
.modal-body{padding:18px 20px}
.modal-foot{
  position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:9px;justify-content:flex-end;
}

/* ---------- toast ---------- */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:200;
  display:grid;gap:8px;width:calc(100% - 32px);max-width:420px;
}
@media(min-width:1000px){#toasts{bottom:24px}}
.toast{
  background:var(--ink);color:#fff;border-radius:12px;padding:11px 15px;
  font-size:14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 24px rgba(46,15,38,.24);
  animation:toastin .26s cubic-bezier(.2,.7,.3,1) both;
}
.toast svg{color:var(--gold-lite);flex:none}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{animation:toastout .22s ease forwards}
@keyframes toastout{to{opacity:0;transform:translateY(6px)}}

/* ---------- sheet (mobile "more") ---------- */
.sheet-list{display:grid;gap:2px}
.sheet-list button{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;
  background:#fff;border:1px solid var(--line);font-size:15px;font-weight:500;text-align:left;
}
.sheet-list button svg{color:var(--plum)}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--line);margin:22px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack-gap{display:grid;gap:10px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- print: media kit only ---------- */
@media print{
  body{background:#fff;padding:0}
  .topbar,.sidebar,.tabbar,#toasts,.no-print{display:none !important}
  .layout{padding:0}
  .shell{max-width:100%;padding:0}
  .view{padding:0;animation:none}
  .kit{border:0;border-radius:0}
  .kit-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- auth / setup screens ---------- */
.gate{
  min-height:100vh;display:grid;place-items:center;padding:24px 18px;
  background:
    radial-gradient(120% 90% at 80% 0%,rgba(193,151,47,.16),transparent 60%),
    linear-gradient(165deg,#3E1533,var(--ink) 60%,#1E0918);
}
.gate-card{
  width:100%;max-width:430px;background:var(--paper);
  border-radius:20px;padding:28px 24px;
  box-shadow:0 20px 60px rgba(20,5,16,.45);
  animation:rise .4s ease both;
}
.gate-mark{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.gate h1{font-family:var(--f-display);font-size:26px;letter-spacing:-.02em;margin-bottom:6px}
.gate p.lead{color:var(--mauve);font-size:14px;margin-bottom:20px}
.gate .f{margin-bottom:13px}
.gate .btn{width:100%;padding:12px}
.gate-switch{
  text-align:center;margin-top:16px;font-size:13.5px;color:var(--mauve);
}
.gate-switch button{color:var(--plum);font-weight:600;text-decoration:underline}
.gate-err{
  background:#F8EDED;color:var(--rust);border-radius:10px;padding:10px 13px;
  font-size:13.5px;margin-bottom:14px;
}
.gate-ok{
  background:#E9F2EF;color:var(--jade);border-radius:10px;padding:10px 13px;
  font-size:13.5px;margin-bottom:14px;
}
.roleopts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.roleopt{
  border:1.5px solid var(--line);border-radius:12px;padding:11px;background:#fff;
  text-align:left;font-size:13.5px;
}
.roleopt[aria-pressed="true"]{border-color:var(--gold);background:#FDFAF2}
.roleopt b{display:block;font-size:14px}
.roleopt span{color:var(--mauve);font-size:12px}

.setup-code{
  background:var(--ink);color:#EBD7A0;border-radius:10px;padding:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  overflow-x:auto;white-space:pre;margin:12px 0;
}

/* ---------- loading ---------- */
.skel{
  background:linear-gradient(90deg,#F1EAEE 25%,#F8F4F6 50%,#F1EAEE 75%);
  background-size:400% 100%;animation:shimmer 1.3s ease infinite;
  border-radius:10px;height:14px;margin-bottom:9px;
}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.skel.tall{height:120px;border-radius:14px;margin-bottom:14px}
.loading-wrap{padding:22px 0}

.saving{opacity:.55;pointer-events:none}

</style>
</head>
<body>

<aside class="sidebar no-print" id="sidebar" hidden>

<script type="module">
/* ============================================================
   OMA — live build, connected to Supabase.

   >>> PASTE YOUR TWO VALUES HERE <<<
   Supabase dashboard > Settings > API
   Use the "anon / public" key. NEVER the service_role key.
   ============================================================ */

const CONFIG = {
  url:     "https://kfxecxvbssunmqcjfgge.supabase.co/rest/v1/",      // e.g. https://abcdefgh.supabase.co
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmeGVjeHZic3N1bm1xY2pmZ2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzgwOTIsImV4cCI6MjEwNDUxNDA5Mn0.lC2Mt7yKOhQ2uXF1tjrj8iXKqXmD7yuBFWEWPC805ew"
};

/* ============================================================ */

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const configured = CONFIG.url.startsWith("http") && CONFIG.anonKey.length > 20;
const sb = configured ? createClient(CONFIG.url, CONFIG.anonKey) : null;

const state = {
  session:null,
  profile:null,
  athleteId:null,      // the athlete currently being viewed
  athlete:null,
  roster:[],
  wards:[],
  route:"dashboard",
  busy:false
};

/* ---------- tiny helpers ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cents = n => "$"+((n||0)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const compact = n => !n ? "0" : n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,"")+"K" : String(n);
const fmt = d => d ? new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}) : "—";
const initialsOf = s => (s||"?").split(" ").filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase();

const statusClass = s => ({
  "Replied":"jade","Deal closed":"jade","Paid":"jade","Signed":"jade","Partnered":"jade","Approved":"jade","Active":"jade",
  "Opened":"gold","Pending":"gold","In progress":"gold","Awaiting approval":"gold",
  "Declined":"rust","Sent":"neutral","Not contacted":"neutral","Draft":"neutral","Completed":"plum","Posted":"plum",
  "Needs profile update":"gold","In negotiation":"gold"
}[s] || "neutral");

const ico = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 16 0v1"/>',
  kit:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/>',
  gallery:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m3 17 5-4 4 3 3-2 6 5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  deals:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  brands:'<path d="M3 21h18M5 21V8l7-5 7 5v13M10 21v-5h4v5"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="m4 12 5 5L20 6"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
  down:'<path d="M12 3v13M7 12l5 5 5-5M4 21h16"/>', upload:'<path d="M12 21V8M7 12l5-5 5 5M4 3h16"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  star:'<path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  send:'<path d="M21 3 3 10.5l7 3 3 7z"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>'
};
const svg = (k,s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ico[k]||""}</svg>`;

function toast(msg, bad){
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = svg(bad?"x":"check",17)+"<span>"+esc(msg)+"</span>";
  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),230); }, 3000);
}

let lastFocus=null;
function openModal({title, body, foot=""}){
  lastFocus = document.activeElement;
  $("#modal-root").innerHTML =
   `<div class="scrim" data-close-scrim><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h2>${esc(title)}</h2>
        <button class="icon-btn" data-close aria-label="Close">${svg("x",19)}</button></div>
      <div class="modal-body">${body}</div>
      ${foot?`<div class="modal-foot">${foot}</div>`:""}
    </div></div>`;
  document.body.style.overflow="hidden";
  const f = $("#modal-root").querySelector("input,textarea,select");
  if(f) setTimeout(()=>f.focus(),60);
}
function closeModal(){
  $("#modal-root").innerHTML=""; document.body.style.overflow="";
  if(lastFocus?.focus) lastFocus.focus();
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- query wrapper: surfaces RLS errors instead of silently empty ---------- */
async function q(promise, label){
  const { data, error } = await promise;
  if(error){
    console.error(label||"query", error);
    toast(error.message.slice(0,90), true);
    return null;
  }
  return data;
}

   AUTH / GATE SCREENS
   ============================================================ */

let gateMode = "signin", gateRole = "athlete", gateMsg = null;

};</div>

  const err = gateMsg ? `<div class="gate-${gateMsg.ok?"ok":"err"}">${esc(gateMsg.text)}</div>` : "";
  showGate(`<div class="gate-card">
    <div class="gate-mark"><span class="mark-badge">OM</span><span class="mark-text">Athletes<span> Portal</span></span></div>

    <div class="f"><label for="g-pass">Password</label><input id="g-pass" type="password" autocomplete="${gateMode==="signin"?"current-password":"new-password"}"></div>
    <button class="btn btn-primary" data-act="${gateMode==="signin"?"do-signin":"do-signup"}">

    <p class="gate-switch">${gateMode==="signin"

function onboardScreen(){
  showGate(`<div class="gate-card">
    <div class="gate-mark"><span class="mark-badge">OM</span><span class="mark-text">Athletes<span> Portal</span></span></div>
    <h1>Let's build your file</h1>

function unlinkedScreen(){
  showGate(`<div class="gate-card">
    <div class="gate-mark"><span class="mark-badge">OM</span><span class="mark-text">Athletes<span> Portal</span></span></div>

/* ============================================================
   NAV
   ============================================================ */

const NAV_ATHLETE = [
  {id:"dashboard",label:"Dashboard",icon:"home",tab:true},
  {id:"profile",  label:"Profile",  icon:"user"},
  {id:"mediakit", label:"Media kit",icon:"kit",tab:true},
  {id:"gallery",  label:"Gallery",  icon:"gallery"},
  {id:"outreach", label:"Outreach", icon:"mail",tab:true},
  {id:"deals",    label:"Deals",    icon:"deals",tab:true},
  {id:"brands",   label:"Brands",   icon:"brands"},
  {id:"messages", label:"Messages", icon:"chat"},
  {id:"settings", label:"Settings", icon:"lock"}
];
const NAV_GUARDIAN = [
  {id:"dashboard",label:"Overview", icon:"home",tab:true},
  {id:"approvals",label:"Approvals",icon:"check",tab:true},
  {id:"earnings", label:"Earnings", icon:"deals",tab:true},
  {id:"messages", label:"Messages", icon:"chat",tab:true}
];
const NAV_ADMIN = [
  {id:"roster",   label:"Roster",   icon:"user",tab:true},
  {id:"athlete",  label:"Athlete",  icon:"kit",tab:true},
  {id:"outreach", label:"Outreach", icon:"mail",tab:true},
  {id:"funding",  label:"Funding",  icon:"deals",tab:true},
  {id:"crm",      label:"Brands",   icon:"brands"}
];
const navFor = r => r==="admin" ? NAV_ADMIN : r==="guardian" ? NAV_GUARDIAN : NAV_ATHLETE;

function renderNav(){
  const nav = navFor(state.profile.role);
  $("#sidenav").innerHTML = `<p class="nav-label">${
    state.profile.role==="admin"?"Agency tools":state.profile.role==="guardian"?"Guardian view":"Your portal"}</p>` +
    nav.map(n=>`<button class="nav-item" data-go="${n.id}" ${state.route===n.id?'aria-current="page"':""}>${svg(n.icon,17)}${n.label}</button>`).join("");
  const tabs = nav.filter(n=>n.tab);
  $("#tabbar").innerHTML = tabs.map(n=>
    `<button class="tab" data-go="${n.id}" ${state.route===n.id?'aria-current="page"':""}>${svg(n.icon,21)}<span>${n.label}</span></button>`).join("")
    + (nav.length>tabs.length ? `<button class="tab" data-act="more" ${!tabs.some(t=>t.id===state.route)?'aria-current="page"':""}>${svg("more",21)}<span>More</span></button>` : "");
  $("#rolename").textContent = state.profile.full_name || state.profile.email;
  $("#rolelabel").textContent = state.profile.role==="admin"?"OMA staff":state.profile.role==="guardian"?"Guardian":"Athlete";
  $("#topavatar").textContent = initialsOf(state.profile.full_name||state.profile.email);
}

/* ============================================================
   BOOT
   ============================================================ */

async function boot(){
  if(!configured){ setupScreen(); return; }

  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(!session){ authScreen(); return; }

  const prof = await q(sb.from("profiles").select("*").eq("id",session.user.id).single(),"profile");
  if(!prof){ authScreen(); return; }
  state.profile = prof;

  if(prof.role==="athlete"){
    const rows = await q(sb.from("athlete_public").select("*").eq("profile_id",prof.id),"my athlete");
    if(!rows || !rows.length){ onboardScreen(); return; }
    state.athlete = rows[0]; state.athleteId = rows[0].id;
    state.route = "dashboard";
  }

  if(prof.role==="guardian"){
    const links = await q(sb.from("guardian_links").select("athlete_id").eq("guardian_id",prof.id),"links");
    if(!links || !links.length){ unlinkedScreen(); return; }
    state.wards = links.map(l=>l.athlete_id);
    state.athleteId = state.wards[0];
    const a = await q(sb.from("athlete_public").select("*").eq("id",state.athleteId).single(),"ward");
    state.athlete = a;
    state.route = "dashboard";
  }

  if(prof.role==="admin"){
    state.roster = await q(sb.from("athletes").select("*").order("last_name"),"roster") || [];
    state.route = "roster";
    if(state.roster.length){ state.athleteId = state.roster[0].id; state.athlete = state.roster[0]; }
  }

  hideGate();
  render();
}

sb?.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT"){ location.reload(); }
});

async function render(){

function completion(a, socials){

}

/* ============================================================
   ACTIONS
   ============================================================ */

const ACT = {

  /* ---- gate ---- */
  "gate-switch"(el){ gateMode = el.dataset.id; gateMsg = null; authScreen(); },
  "gate-role"(el){ gateRole = el.dataset.id; authScreen(); },

  async "do-signin"(){
    const email = $("#g-email").value.trim(), password = $("#g-pass").value;
    if(!email || !password){ gateMsg={text:"Email and password required"}; return authScreen(); }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ gateMsg={text:error.message}; return authScreen(); }
    gateMsg = null; boot();
  },

  async "do-signup"(){
    const email = $("#g-email").value.trim(), password = $("#g-pass").value;
    const full_name = $("#g-name").value.trim();
    if(!email || password.length < 6){ gateMsg={text:"Use a valid email and a password of at least 6 characters"}; return authScreen(); }
    const { data, error } = await sb.auth.signUp({
      email, password, options:{ data:{ full_name, role:gateRole } }
    });
    if(error){ gateMsg={text:error.message}; return authScreen(); }
    if(!data.session){
      gateMsg={ok:true, text:"Check your email to confirm your account, then sign in."};
      gateMode = "signin"; return authScreen();
    }
    gateMsg = null; boot();
  },

  async "create-athlete"(){
    const first_name = $("#o-first").value.trim(), last_name = $("#o-last").value.trim();
    if(!first_name || !last_name){ toast("Add your name", true); return; }
    const row = await q(sb.from("athletes").insert({
      profile_id: state.profile.id, first_name, last_name,
      sport: $("#o-sport").value.trim() || null,
      school: $("#o-school").value.trim() || null,
      roster_flag: "Needs profile update"
    }).select().single(),"create athlete");
    if(row) boot();
  },

  reload(){ boot(); },
  async signout(){ await sb.auth.signOut(); location.reload(); },
  account(){ ACT.more(); },

  more(){
    const nav = navFor(state.profile.role);
    openModal({ title:"More", body:`<div class="sheet-list">
      ${nav.filter(n=>!n.tab).map(n=>`<button data-go="${n.id}">${svg(n.icon,19)}${n.label}</button>`).join("")}
      <button data-act="signout">Sign out</button></div>` });
  },

  /* ---- profile ---- */
  "edit-profile"(){
    const a = state.athlete;
    const fld = (id,label,val,type="text") =>
      `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val??"")}"></div>`;
    openModal({ title:"Edit profile",
      body:`<div class="form-grid two">
        ${fld("p-first","First name",a.first_name)}${fld("p-last","Last name",a.last_name)}
        ${fld("p-nick","Preferred name",a.nickname)}${fld("p-num","Jersey number",a.jersey_number)}
        ${fld("p-school","School",a.school)}${fld("p-class","Class year",a.class_year)}
        ${fld("p-sport","Sport",a.sport)}${fld("p-pos","Position",a.position)}
        ${fld("p-height","Height",a.height)}${fld("p-weight","Weight",a.weight)}
        ${fld("p-gpa","GPA",a.gpa,"number")}${fld("p-town","Hometown",a.hometown)}
        ${fld("p-eng","Engagement rate",a.engagement_rate)}${fld("p-avail","Availability",a.availability)}
        <div class="f span"><label for="p-aud">Audience</label><input id="p-aud" value="${esc(a.audience_note??"")}" placeholder="71% female · 62% aged 13–24"></div>
        <div class="f span"><label for="p-short">Short bio</label><textarea id="p-short" style="min-height:60px">${esc(a.bio_short??"")}</textarea></div>
        <div class="f span"><label for="p-long">Long bio</label><textarea id="p-long">${esc(a.bio_long??"")}</textarea></div>

      foot:`<button class="btn" data-close>Cancel</button>
            <button class="btn btn-primary" data-act="save-profile">Save</button>` });

      body:`<div class="f"><label for="dc">What needs to change</label><textarea id="dc"></textarea></div>`,
      foot:`<button class="btn" data-close>Cancel</button>
            <button class="btn btn-primary" data-act="decline-yes" data-id="${el.dataset.id}">Send</button>` });
  },
  async "decline-yes"(el){
    const note = $("#dc").value.trim();
    if(await q(sb.from("deals").update({approval:"Changes requested", terms:note||null}).eq("id",el.dataset.id).select(),"decline")){
      closeModal(); render(); toast("Sent back for changes");
    }
  },

  /* ---- payments ---- */
  "log-payment"(el){
    openModal({ title:"Log a payment",
      body:`<div class="form-grid two">
        <div class="f"><label for="py-src">From</label><input id="py-src" value="${esc(el.dataset.brand||"")}"></div>
        <div class="f"><label for="py-amt">Amount (dollars)</label><input id="py-amt" type="number" step="0.01" value="${el.dataset.amt?(Number(el.dataset.amt)/100):""}"></div>
        <div class="f span"><label for="py-date">Date received</label><input id="py-date" type="date"></div>
      </div>${state.profile.role!=="admin"?`<p class="hint" style="margin-top:12px">Only OMA staff can record payments. Ask your agent to log this.</p>`:""}`,
      foot:`<button class="btn" data-close>Cancel</button>
            <button class="btn btn-primary" data-act="save-payment" data-id="${el.dataset.id||""}">Log payment</button>` });
  },
  async "save-payment"(el){
    const source = $("#py-src").value.trim();
    const amount_cents = Math.round(Number($("#py-amt").value||0)*100);
    if(!source || !amount_cents){ toast("Add a source and amount", true); return; }
    const row = await q(sb.from("payments").insert({
      athlete_id:A(), deal_id:el.dataset.id||null, source, amount_cents,
      received_on: $("#py-date").value || new Date().toISOString().slice(0,10)
    }).select(),"payment");
    if(!row) return;
    if(el.dataset.id) await sb.from("deals").update({status:"Paid"}).eq("id",el.dataset.id);
    closeModal(); render(); toast("Payment logged");
  },

  /* ---- outreach ---- */
  async "new-outreach"(){
    const [socials, brands] = await Promise.all([load.socials(), load.brands()]);
    const a = state.athlete;
    const reach = (socials||[]).reduce((s,x)=>s+(x.followers||0),0);
    const draft = `Hi there,

I'm ${a.first_name} ${a.last_name}, a ${a.position||"student athlete"} at ${a.school||"my school"}${a.hometown?" in "+a.hometown:""}.

Where I stand: ${compact(reach)} followers across ${(socials||[]).length||"my"} platforms${a.engagement_rate?", "+a.engagement_rate+" engagement":""}${a.audience_note?", and an audience that's "+a.audience_note.toLowerCase():""}.

${a.bio_short||""}

I've attached my media kit. Happy to talk about what a partnership could look like.

Thanks for the time,
${a.first_name}`;
    openModal({ title:"Draft an email",
      body:`<div class="form-grid">
        <div class="f"><label for="o-brand">Brand</label>
          <input id="o-brand" list="brandlist" placeholder="Brand name">
          <datalist id="brandlist">${(brands||[]).map(b=>`<option>${esc(b.name)}</option>`).join("")}</datalist></div>
        <div class="f"><label for="o-contact">Contact</label><input id="o-contact" placeholder="Name, role"></div>
        <div class="f"><label for="o-body">Email</label><textarea id="o-body" style="min-height:220px">${esc(draft)}</textarea></div>
      </div>
      <p class="hint" style="margin-top:10px">Written from your profile. Edit before sending — copy it into your email client for now.</p>`,
      foot:`<button class="btn" data-close>Cancel</button>
            <button class="btn btn-primary" data-act="save-outreach">Log as sent</button>` });
  },
  async "save-outreach"(){
    const brand_name = $("#o-brand").value.trim();
    if(!brand_name){ toast("Which brand?", true); return; }
    if(await q(sb.from("outreach").insert({
      athlete_id:A(), brand_name, contact:$("#o-contact").value.trim()||null,
      status:"Sent", sent_on:new Date().toISOString().slice(0,10),
      created_by: state.profile.id
    }).select(),"outreach")){ closeModal(); go("outreach"); toast("Logged"); }
  },
  "log-outreach"(){
    openModal({ title:"Log outreach",
      body:`<div class="form-grid two">
        <div class="f"><label for="lo-brand">Brand</label><input id="lo-brand"></div>
        <div class="f"><label for="lo-contact">Contact</label><input id="lo-contact"></div>
        <div class="f"><label for="lo-date">Date sent</label><input id="lo-date" type="date"></div>
        <div class="f"><label for="lo-status">Status</label>
          <select id="lo-status"><option>Sent</option><option>Opened</option><option>Replied</option><option>Declined</option><option>Deal closed</option></select></div>
        <div class="f span"><label for="lo-notes">Notes</label><textarea id="lo-notes" style="min-height:70px"></textarea></div>
      </div>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-act="save-log">Log it</button>` });
  },
  async "save-log"(){
    const brand_name = $("#lo-brand").value.trim();
    if(!brand_name){ toast("Which brand?", true); return; }
    if(await q(sb.from("outreach").insert({
      athlete_id:A(), brand_name, contact:$("#lo-contact").value.trim()||null,
      sent_on:$("#lo-date").value||new Date().toISOString().slice(0,10),
      status:$("#lo-status").value, notes:$("#lo-notes").value.trim()||null,
      created_by: state.profile.id
    }).select(),"outreach")){ closeModal(); render(); toast("Logged"); }
  },
  async "edit-outreach"(el){
    const r = (await load.outreach()||[]).find(x=>x.id===el.dataset.id);
    if(!r) return;
    openModal({ title:r.brand_name,
      body:`<div class="f"><label for="eo-status">Status</label>
        <select id="eo-status">${["Sent","Opened","Replied","Declined","Deal closed"].map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></div>
        <div class="f" style="margin-top:12px"><label for="eo-follow">Follow up on</label><input id="eo-follow" type="date" value="${r.follow_up_on||""}"></div>
        <div class="f" style="margin-top:12px"><label for="eo-notes">Notes</label><textarea id="eo-notes" style="min-height:80px">${esc(r.notes||"")}</textarea></div>`,
      foot:`<button class="btn" data-close>Cancel</button>
            <button class="btn btn-primary" data-act="save-edit-outreach" data-id="${r.id}">Save</button>` });
  },
  async "save-edit-outreach"(el){
    if(await q(sb.from("outreach").update({
      status:$("#eo-status").value,
      follow_up_on:$("#eo-follow").value||null,
      notes:$("#eo-notes").value.trim()||null
    }).eq("id",el.dataset.id).select(),"outreach")){ closeModal(); render(); toast("Updated"); }
  },

  /* ---- media ---- */
  upload(){
    openModal({ title:"Upload media",
      body:`<div class="form-grid">
        <div class="f"><label for="m-file">Files</label><input id="m-file" type="file" multiple accept="image/*,video/*"></div>
        <div class="f"><label for="m-folder">Album</label>
          <select id="m-folder"><option>Headshots</option><option>Action shots</option><option>Sponsor content</option><option>Behind the scenes</option><option>Game day</option><option>Social posts</option></select></div>
        <div class="f"><label for="m-flag">Status</label>
          <select id="m-flag"><option>Draft</option><option>Approved</option><option>Posted</option></select></div>
      </div>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-act="do-upload">Upload</button>` });
  },
  async "do-upload"(el){
    const files = $("#m-file").files;
    if(!files.length){ toast("Pick a file", true); return; }
    el.classList.add("saving"); el.textContent = "Uploading…";
    const folder = $("#m-folder").value, flag = $("#m-flag").value;
    let ok = 0;
    for(const file of files){
      const safe = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const path = `${A()}/${Date.now()}-${safe}`;
      const { error } = await sb.storage.from("media").upload(path, file);
      if(error){ toast(error.message.slice(0,80), true); continue; }
      const row = await q(sb.from("media").insert({
        athlete_id:A(), storage_path:path, name:file.name.replace(/\.[^.]+$/,""), folder, flag
      }).select(),"media row");
      if(row) ok++;
    }
    closeModal(); render();
    toast(ok ? `${ok} file${ok>1?"s":""} uploaded` : "Upload failed", !ok);
  },
  async fav(el){
    const favorite = el.dataset.v !== "true";
    if(await q(sb.from("media").update({favorite}).eq("id",el.dataset.id).select(),"media")) render();
  },
  async "del-media"(el){
    await sb.storage.from("media").remove([el.dataset.path]);
    if(await q(sb.from("media").delete().eq("id",el.dataset.id).select(),"media")){ render(); toast("Deleted"); }
  },

  /* ---- messages ---- */
  async "send-msg"(el){
    const box = $("#msg"); const body = box.value.trim();
    if(!body) return;
    if(await q(sb.from("messages").insert({
      athlete_id:A(), sender_id:state.profile.id, audience:el.dataset.lane, body
    }).select(),"message")){ box.value=""; render(); }
  },

  /* ---- guardians ---- */
  "link-guardian"(){
    openModal({ title:"Link a guardian",
      body:`<p class="hint" style="margin-bottom:14px">They need to have signed up as a parent first. Enter the email they used.</p>
        <div class="f"><label for="lg-email">Guardian's email</label><input id="lg-email" type="email"></div>
        <div class="f" style="margin-top:12px"><label for="lg-rel">Relationship</label><input id="lg-rel" placeholder="Mother"></div>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-act="do-link">Link</button>` });
  },
  async "do-link"(){
    const email = $("#lg-email").value.trim();
    if(!email){ toast("Enter an email", true); return; }
    const id = await q(sb.rpc("find_guardian",{p_email:email}),"find guardian");
    if(!id){ toast("No parent account with that email", true); return; }
    if(await q(sb.from("guardian_links").insert({
      guardian_id:id, athlete_id:A(), relationship:$("#lg-rel").value.trim()||null
    }).select(),"link")){ closeModal(); render(); toast("Guardian linked"); }
  },
  async "unlink-guardian"(el){
    if(await q(sb.from("guardian_links").delete().eq("guardian_id",el.dataset.id).eq("athlete_id",A()).select(),"unlink")){
      render(); toast("Removed");
    }
  },

  /* ---- admin ---- */
  async "open-athlete"(el){
    state.athleteId = el.dataset.id;
    state.athlete = state.roster.find(r=>r.id===el.dataset.id);
    go("athlete");
  },
  async "save-note"(){
    if(await q(sb.from("athletes").update({internal_note:$("#a-note").value.trim()||null}).eq("id",A()).select(),"note"))
      toast("Note saved");
  },
  "set-flag"(){
    openModal({ title:"Athlete status",
      body:`<div class="f"><label for="fl">Status</label><select id="fl">
        ${["Active","In negotiation","Needs profile update","Paused"].map(s=>`<option ${s===state.athlete.roster_flag?"selected":""}>${s}</option>`).join("")}</select></div>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-act="save-flag">Save</button>` });
  },
  async "save-flag"(){
    if(await q(sb.from("athletes").update({roster_flag:$("#fl").value}).eq("id",A()).select(),"flag")){
      closeModal(); render(); toast("Status updated");
    }
  },
  "add-athlete"(){
    openModal({ title:"Add an athlete",
      body:`<div class="form-grid two">
        <div class="f"><label for="na-first">First name</label><input id="na-first"></div>
        <div class="f"><label for="na-last">Last name</label><input id="na-last"></div>
        <div class="f"><label for="na-sport">Sport</label><input id="na-sport"></div>
        <div class="f"><label for="na-school">School</label><input id="na-school"></div>
      </div>
      <p class="hint" style="margin-top:12px">This creates the file. The athlete claims it by signing up with the same email — or you can leave it unclaimed.</p>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-act="save-athlete">Add</button>` });
  },
  async "save-athlete"(){
    const first_name = $("#na-first").value.trim(), last_name = $("#na-last").value.trim();
    if(!first_name || !last_name){ toast("Add a name", true); return; }
    if(await q(sb.from("athletes").insert({
      first_name, last_name,
      sport:$("#na-sport").value.trim()||null, school:$("#na-school").value.trim()||null,
      roster_flag:"Needs profile update"
    }).select(),"athlete")){ closeModal(); render(); toast("Athlete added"); }
  },
  "add-brand"(){
    openModal({ title:"Add a brand",
      body:`<div class="form-grid two">
        <div class="f"><label for="b-name">Name</label><input id="b-name"></div>
        <div class="f"><label for="b-cat">Category</label><input id="b-cat" placeholder="Athletic apparel"></div>
        <div class="f span"><label for="b-looks">What they look for</label><textarea id="b-looks" style="min-height:70px"></textarea></div>
        <div class="f"><label for="b-status">Status</label>
          <select id="b-status"><option>Not contacted</option><option>In progress</option><option>Partnered</option></select></div>
      </div>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-act="save-brand">Add</button>` });
  },
  async "save-brand"(){
    const name = $("#b-name").value.trim();
    if(!name){ toast("Add a name", true); return; }
    if(await q(sb.from("brands").insert({
      name, category:$("#b-cat").value.trim()||null,
      looks_for:$("#b-looks").value.trim()||null, status:$("#b-status").value
    }).select(),"brand")){ closeModal(); render(); toast("Brand added"); }
  },
  async "add-contact"(){
    const brands = await load.brands() || [];
    if(!brands.length){ toast("Add a brand first", true); return; }
    openModal({ title:"Add a contact",
      body:`<div class="form-grid two">
        <div class="f"><label for="c-brand">Brand</label><select id="c-brand">${brands.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select></div>
        <div class="f"><label for="c-person">Name</label><input id="c-person"></div>
        <div class="f"><label for="c-role">Role</label><input id="c-role"></div>
        <div class="f"><label for="c-email">Email</label><input id="c-email" type="email"></div>
      </div>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-act="save-contact">Add</button>` });
  },
  async "save-contact"(){
    if(await q(sb.from("brand_contacts").insert({
      brand_id:$("#c-brand").value, person:$("#c-person").value.trim()||null,
      job_title:$("#c-role").value.trim()||null, email:$("#c-email").value.trim()||null
    }).select(),"contact")){ closeModal(); render(); toast("Contact added"); }
  },

  /* ---- exports & print ---- */
  "print-kit"(){ toast("Opening print view"); setTimeout(()=>window.print(),400); },
  async "export-payments"(){
    const rows = await load.payments() || [];
    csv("payments.csv", [["Source","Amount","Date"], ...rows.map(p=>[p.source,(p.amount_cents/100).toFixed(2),p.received_on])]);
  },
  async "export-roster"(){
    const rows = state.roster;
    csv("roster.csv", [["First","Last","Sport","School","Status"],
      ...rows.map(r=>[r.first_name,r.last_name,r.sport,r.school,r.roster_flag])]);
  }
};

function csv(filename, rows){
  const text = rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([text],{type:"text/csv"}));
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url); toast("Exported");
}

/* ============================================================
   EVENTS
   ============================================================ */

document.addEventListener("click", e=>{
  const goEl = e.target.closest("[data-go]");
  if(goEl){ e.preventDefault(); go(goEl.dataset.go); return; }
  if(e.target.closest("[data-close]") || e.target.matches("[data-close-scrim]")){ closeModal(); return; }
  const el = e.target.closest("[data-act]");
  if(el && ACT[el.dataset.act]){ e.preventDefault(); ACT[el.dataset.act](el); }
});

document.addEventListener("keydown", e=>{
  if(e.target.id==="msg" && e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    const btn = document.querySelector('[data-act="send-msg"]');
    if(btn) ACT["send-msg"](btn);
  }
  if(e.target.id==="g-pass" && e.key==="Enter"){
    ACT[gateMode==="signin"?"do-signin":"do-signup"]();
  }
});

boot();
</script>
