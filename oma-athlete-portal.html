<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMA — Athlete Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   OMA — Operation Millionaire Athletes
   Athlete Portal prototype. Single file: HTML + CSS + JS.
   ============================================================ */

:root{
  --ink:#2E0F26;
  --plum:#6B2350;
  --plum-soft:#9A5A80;
  --gold:#C1972F;
  --gold-lite:#EBD7A0;
  --paper:#FBF8F7;
  --card:#FFFFFF;
  --line:#EADFE4;
  --mauve:#8A7180;
  --jade:#2F6B58;
  --rust:#A34A4A;

  --r-sm:8px;
  --r-md:14px;
  --r-lg:22px;

  --sidebar:248px;
  --shell:1180px;

  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.shell{max-width:var(--shell);margin:0 auto;padding:0 18px}

.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(251,248,247,.92);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:var(--shell);margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;gap:12px;
}
.mark{display:flex;align-items:center;gap:9px;margin-right:auto;text-decoration:none}
.mark-badge{
  width:32px;height:32px;border-radius:9px;flex:none;
  background:linear-gradient(150deg,var(--plum),var(--ink));
  border:1px solid rgba(193,151,47,.55);
  display:grid;place-items:center;
  color:var(--gold-lite);font-family:var(--f-display);font-size:14px;font-weight:600;
  letter-spacing:.02em;
}
.mark-text{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.mark-text span{color:var(--plum-soft);font-weight:400}

.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:var(--plum);position:relative;border:1px solid transparent;
}
.icon-btn:hover{background:#fff;border-color:var(--line)}
.dot{
  position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;
  background:var(--gold);border:1.5px solid var(--paper);
}
.avatar-btn{
  width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;
  border:1.5px solid var(--gold);
  background:linear-gradient(150deg,var(--plum-soft),var(--plum));
  display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;
}
.searchwrap{display:none}
@media(min-width:860px){
  .searchwrap{
    display:flex;align-items:center;gap:8px;flex:1;max-width:320px;
    background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 11px;
    color:var(--mauve);
  }
  .searchwrap input{border:0;background:none;outline:none;width:100%;font-size:14px}
}

/* ---------- sidebar ---------- */
.sidebar{display:none}
@media(min-width:1000px){
  body{padding-bottom:40px}
  .sidebar{
    display:block;position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);
    background:linear-gradient(175deg,var(--ink),var(--plum) 130%);
    padding:18px 14px;overflow-y:auto;z-index:50;
  }
  .sidebar .mark{margin:4px 6px 22px}
  .sidebar .mark-text{color:#fff}
  .sidebar .mark-text span{color:var(--gold-lite)}
  .layout{padding-left:var(--sidebar)}
  .topbar-in,.shell{max-width:calc(var(--shell) - 120px)}
}
.nav-group{margin-bottom:20px}
.nav-label{
  font-size:11px;color:rgba(235,215,160,.55);letter-spacing:.04em;
  padding:0 10px 7px;font-weight:500;
}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 10px;border-radius:10px;color:rgba(255,255,255,.72);
  font-size:14.5px;font-weight:500;margin-bottom:2px;
}
.nav-item svg{flex:none;opacity:.8}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item[aria-current="page"]{
  background:rgba(193,151,47,.16);color:#fff;
  box-shadow:inset 2px 0 0 var(--gold);
}
.nav-item[aria-current="page"] svg{opacity:1;color:var(--gold-lite)}
.nav-count{
  margin-left:auto;font-size:11.5px;background:var(--gold);color:var(--ink);
  border-radius:20px;padding:1px 7px;font-weight:600;
}

/* ---------- bottom bar (mobile) ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
@media(min-width:1000px){.tabbar{display:none}}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--mauve);font-size:10.5px;font-weight:500;border-radius:10px;
}
.tab[aria-current="page"]{color:var(--plum)}
.tab[aria-current="page"] svg{color:var(--gold)}

/* ---------- generic ---------- */
.view{padding:20px 0 40px;animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-family:var(--f-display);font-size:29px;letter-spacing:-.02em}
.page-head p{color:var(--mauve);font-size:14px;max-width:56ch}
.page-head .grow{margin-right:auto}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px;margin-bottom:16px;
}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-head h2{font-size:16px;letter-spacing:-.01em}
.panel-head .grow{margin-right:auto}
.panel-note{color:var(--mauve);font-size:13.5px;margin-top:-6px;margin-bottom:14px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:10px;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  transition:transform .12s ease,background .15s ease,border-color .15s ease;
}
.btn:hover{border-color:var(--plum-soft)}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--plum);color:#fff;border-color:var(--plum)}
.btn-primary:hover{background:#571c41;border-color:#571c41}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),#a87f22);
  color:#fff;border-color:#a87f22;
}
.btn-gold:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--plum);padding:9px 10px}
.btn-ghost:hover{background:#fff;border-color:var(--line)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn-row{display:flex;flex-wrap:wrap;gap:9px}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600;
  background:#F4EDF1;color:var(--plum);
}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.neutral{background:#F2EFF1;color:var(--mauve)}
.chip.gold{background:#FAF2DE;color:#8A6A16}
.chip.jade{background:#E9F2EF;color:var(--jade)}
.chip.rust{background:#F8EDED;color:var(--rust)}
.chip.plum{background:#F4EDF1;color:var(--plum)}
.chip.plain::before{display:none}

.hint{color:var(--mauve);font-size:13px}
.empty{
  text-align:center;padding:34px 18px;color:var(--mauve);
  border:1px dashed var(--line);border-radius:var(--r-md);background:#fff;
}
.empty h3{font-family:var(--f-display);font-size:19px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:14px;max-width:42ch;margin:0 auto 14px}

/* ---------- player card ---------- */
.playercard{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:
    radial-gradient(120% 100% at 88% 8%,rgba(193,151,47,.30),transparent 55%),
    linear-gradient(160deg,#3E1533,var(--ink) 55%,#1E0918);
  border:1px solid rgba(193,151,47,.5);
  color:#fff;padding:22px;margin-bottom:16px;
  animation:cardin .55s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.playercard::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(235,215,160,.16) 46%,transparent 58%);
}
.pc-top{display:flex;gap:16px;align-items:flex-start;position:relative;z-index:1}
.pc-portrait{
  width:76px;height:76px;flex:none;border-radius:16px;overflow:hidden;
  border:1.5px solid rgba(235,215,160,.6);
  background:linear-gradient(150deg,var(--plum-soft),var(--plum));
  display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#fff;
}
.pc-name{font-family:var(--f-display);font-size:30px;letter-spacing:-.025em;line-height:1.05}
.pc-meta{color:rgba(255,255,255,.72);font-size:13.5px;margin-top:5px}
.pc-num{
  position:absolute;top:14px;right:18px;z-index:1;
  font-family:var(--f-display);font-size:62px;font-weight:600;line-height:1;
  color:transparent;-webkit-text-stroke:1.4px rgba(235,215,160,.5);
}
.pc-stats{
  position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);
}
.pc-stat b{display:block;font-family:var(--f-display);font-size:23px;font-weight:600;letter-spacing:-.02em}
.pc-stat span{font-size:12px;color:rgba(255,255,255,.62)}
.pc-progress{
  position:relative;z-index:1;margin-top:18px;display:flex;align-items:center;gap:13px;
}
.ring{width:52px;height:52px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(255,255,255,.16)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring text{fill:#fff;font-family:var(--f-ui);font-size:15px;font-weight:600;text-anchor:middle}
.pc-progress p{font-size:13.5px;color:rgba(255,255,255,.78);line-height:1.4}
.pc-progress b{color:#fff;display:block;font-size:14.5px;font-weight:600}

/* ---------- money strip ---------- */
.strip{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;margin-bottom:16px;
}
.strip div{padding:15px 16px;border-right:1px solid var(--line)}
.strip div:last-child{border-right:0}
.strip b{display:block;font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.strip span{font-size:12.5px;color:var(--mauve)}
@media(max-width:520px){
  .strip b{font-size:19px}
  .strip div{padding:12px 11px}
}

/* ---------- lists ---------- */
.rows{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff}
.row{
  display:flex;align-items:center;gap:13px;padding:13px 15px;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row .grow{margin-right:auto;min-width:0}
.row b{display:block;font-size:14.5px;font-weight:600}
.row small{color:var(--mauve);font-size:12.5px}
.row-stack{flex-wrap:wrap}

.tick{
  width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line);
  display:grid;place-items:center;color:transparent;background:#fff;
}
.tick.done{background:var(--jade);border-color:var(--jade);color:#fff}

.brandmark{
  width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-family:var(--f-display);font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(145deg,var(--plum-soft),var(--plum));
}
.brandmark.g{background:linear-gradient(145deg,var(--gold),#96701c)}
.brandmark.i{background:linear-gradient(145deg,#4d6b7d,#2d4353)}

/* ---------- quick actions ---------- */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media(max-width:600px){.quick{grid-template-columns:1fr 1fr 1fr;gap:8px}}
.quick button{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.25;
}
.quick button:hover{border-color:var(--plum-soft)}
.quick svg{color:var(--gold)}

/* ---------- profile fields ---------- */
.fields{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff}
.field{
  display:grid;grid-template-columns:190px 1fr auto;gap:14px;align-items:center;
  padding:11px 15px;border-bottom:1px solid var(--line);
}
.field:last-child{border-bottom:0}
.field dt{color:var(--mauve);font-size:13.5px}
.field dd{margin:0;font-size:14.5px;font-weight:500}
.field .lock{color:var(--mauve)}
@media(max-width:700px){
  .field{grid-template-columns:1fr auto;gap:2px 10px;padding:11px 14px}
  .field dt{grid-column:1/-1;font-size:12.5px}
}
.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.social{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:#fff}
.social b{display:block;font-family:var(--f-display);font-size:21px;letter-spacing:-.02em}
.social span{font-size:12.5px;color:var(--mauve)}

/* ---------- media kit ---------- */
.kit-shell{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:960px){.kit-shell{grid-template-columns:1fr 260px;align-items:start}}
.templates{display:flex;gap:10px;flex-wrap:wrap}
.tpl{
  border:1.5px solid var(--line);border-radius:var(--r-md);padding:11px 13px;
  background:#fff;text-align:left;min-width:118px;
}
.tpl[aria-pressed="true"]{border-color:var(--gold);background:#FDFAF2}
.tpl b{display:block;font-size:13.5px}
.tpl span{font-size:12px;color:var(--mauve)}
.tpl-swatch{height:34px;border-radius:7px;margin-bottom:8px}
.tpl-swatch.editorial{background:linear-gradient(120deg,#fff 50%,var(--plum) 50%)}
.tpl-swatch.foil{background:linear-gradient(120deg,var(--ink),var(--gold))}
.tpl-swatch.clean{background:linear-gradient(120deg,#F4EDF1,#fff)}

.kit{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;
}
.kit-head{
  padding:26px 24px 22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#3E1533,var(--ink));
}
.kit.foil .kit-head{background:linear-gradient(150deg,var(--ink),#5c4413)}
.kit.clean .kit-head{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.kit.clean .kit-eyebrow{color:var(--plum-soft)}
.kit.clean .kit-sub{color:var(--mauve)}
.kit-eyebrow{font-size:12.5px;color:var(--gold-lite);letter-spacing:.03em;margin-bottom:7px}
.kit-name{font-family:var(--f-display);font-size:38px;letter-spacing:-.03em;line-height:1}
@media(max-width:520px){.kit-name{font-size:28px}}
.kit-sub{color:rgba(255,255,255,.75);font-size:14px;margin-top:8px}
.kit-body{padding:22px 24px 26px;display:grid;gap:22px}
.kit-sec h4{font-family:var(--f-display);font-size:17px;margin-bottom:9px;letter-spacing:-.01em}
.kit-sec p{font-size:14.5px;line-height:1.6;max-width:66ch;color:#3d2437}
.kit-reach{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
.kit-reach div{border-top:2px solid var(--gold);padding-top:8px}
.kit-reach b{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:-.02em}
.kit-reach span{font-size:12px;color:var(--mauve)}
.kit-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.kit-list li{display:flex;gap:9px;font-size:14.5px;align-items:flex-start}
.kit-list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none}
.kit-foot{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--line);padding:16px 24px;background:#FDFBFA;
}
.qr{width:64px;height:64px;flex:none;border-radius:9px;background:
  repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/13px 13px;
  border:3px solid #fff;box-shadow:0 0 0 1px var(--line);
}
.kit-foot b{display:block;font-size:14px}
.kit-foot small{color:var(--mauve);font-size:12.5px}

/* ---------- gallery ---------- */
.folders{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.folder{
  border:1px solid var(--line);background:#fff;border-radius:20px;
  padding:7px 14px;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--mauve);
}
.folder[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff;
  text-align:left;display:flex;flex-direction:column;
}
.tile-img{
  aspect-ratio:4/5;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.5);
}
.tile-img.a{background:linear-gradient(150deg,#5B1F45,#2E0F26)}
.tile-img.b{background:linear-gradient(150deg,#8A6A16,#3a2c09)}
.tile-img.c{background:linear-gradient(150deg,#9A5A80,#5B1F45)}
.tile-img.d{background:linear-gradient(150deg,#4d6b7d,#22333d)}
.tile-fav{
  position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.42);display:grid;place-items:center;color:#fff;
}
.tile-fav.on{color:var(--gold)}
.tile-flag{position:absolute;left:8px;bottom:8px}
.tile-meta{padding:9px 11px}
.tile-meta b{display:block;font-size:13px;font-weight:600}
.tile-meta small{color:var(--mauve);font-size:11.5px}

/* ---------- tables / trackers ---------- */
.tracker{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
.tracker th{
  text-align:left;font-size:12.5px;color:var(--mauve);font-weight:500;
  padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tracker td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.tracker tr:last-child td{border-bottom:0}
.tracker b{font-weight:600}
.tracker small{color:var(--mauve);display:block;font-size:12.5px}
.table-wrap{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.table-scroll{overflow-x:auto}
@media(max-width:760px){
  .table-scroll{display:none}
}
.cards-only{display:none}
@media(max-width:760px){.cards-only{display:block}}

.record{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px;margin-bottom:10px;
}
.record-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.record-top .grow{margin-right:auto;min-width:0}
.record-top b{display:block;font-size:15px}
.record-top small{color:var(--mauve);font-size:12.5px}
.record dl{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 11px}
.record dt{font-size:11.5px;color:var(--mauve)}
.record dd{margin:0;font-size:13.5px;font-weight:600}

/* ---------- messages ---------- */
.thread{display:grid;gap:12px;margin-bottom:16px}
.msg{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5}
.msg small{display:block;font-size:11.5px;margin-top:5px;opacity:.7}
.msg.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{background:var(--plum);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.composer{display:flex;gap:9px;align-items:flex-end}
.composer textarea{
  flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  background:#fff;resize:none;min-height:44px;max-height:130px;outline:none;font-size:14.5px;
}
.composer textarea:focus{border-color:var(--plum-soft)}

/* ---------- forms ---------- */
.form-grid{display:grid;gap:13px}
@media(min-width:640px){.form-grid.two{grid-template-columns:1fr 1fr}}
.f label{display:block;font-size:12.5px;color:var(--mauve);margin-bottom:5px}
.f input,.f select,.f textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  background:#fff;outline:none;font-size:14.5px;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--plum-soft)}
.f textarea{resize:vertical;min-height:92px;line-height:1.55}
.f.span{grid-column:1/-1}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:100;background:rgba(46,15,38,.42);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:fade .2s ease both;
}
@media(min-width:700px){.scrim{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--paper);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;
  border-radius:20px 20px 0 0;animation:slideup .28s cubic-bezier(.2,.7,.3,1) both;
}
@media(min-width:700px){.modal{border-radius:18px}}
@keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{
  position:sticky;top:0;background:var(--paper);padding:18px 20px 12px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:2;
}
.modal-head h2{font-family:var(--f-display);font-size:20px;letter-spacing:-.02em;margin-right:auto}
.modal-body{padding:18px 20px}
.modal-foot{
  position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:9px;justify-content:flex-end;
}

/* ---------- toast ---------- */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:200;
  display:grid;gap:8px;width:calc(100% - 32px);max-width:420px;
}
@media(min-width:1000px){#toasts{bottom:24px}}
.toast{
  background:var(--ink);color:#fff;border-radius:12px;padding:11px 15px;
  font-size:14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 24px rgba(46,15,38,.24);
  animation:toastin .26s cubic-bezier(.2,.7,.3,1) both;
}
.toast svg{color:var(--gold-lite);flex:none}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{animation:toastout .22s ease forwards}
@keyframes toastout{to{opacity:0;transform:translateY(6px)}}

/* ---------- sheet (mobile "more") ---------- */
.sheet-list{display:grid;gap:2px}
.sheet-list button{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;
  background:#fff;border:1px solid var(--line);font-size:15px;font-weight:500;text-align:left;
}
.sheet-list button svg{color:var(--plum)}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--line);margin:22px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack-gap{display:grid;gap:10px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- print: media kit only ---------- */
@media print{
  body{background:#fff;padding:0}
  .topbar,.sidebar,.tabbar,#toasts,.no-print{display:none !important}
  .layout{padding:0}
  .shell{max-width:100%;padding:0}
  .view{padding:0;animation:none}
  .kit{border:0;border-radius:0}
  .kit-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

let lastFocus = null;
function openModal({title, body, foot=""}){
  lastFocus = document.activeElement;
  const root = $("#modal-root");
  root.innerHTML =
    `<div class="scrim" data-close-scrim>
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="modal-head">
          <h2>${esc(title)}</h2>

        </div>
        <div class="modal-body">${body}</div>
        ${foot ? `<div class="modal-foot">${foot}</div>` : ""}
      </div>
    </div>`;
  document.body.style.overflow = "hidden";
  const first = root.querySelector("input,textarea,select,button:not([data-close])");
  if(first) setTimeout(()=>first.focus(),60);
}
function closeModal(){
  $("#modal-root").innerHTML = "";
  document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

  const cur = current();
  $("#sidenav").innerHTML =
    `<p class="nav-label">Your portal</p>` +
    NAV.map(n=>{
      const badge = n.id==="messages" ? `<span class="nav-count">2</span>` : "";
      return `<button class="nav-item" data-go="${n.id}" ${cur===n.id?'aria-current="page"':""}>${svg(n.icon,17)}${n.label}${badge}</button>`;
    }).join("");

  const tabs = NAV.filter(n=>n.tab);
  $("#tabbar").innerHTML =
    tabs.map(n=>`<button class="tab" data-go="${n.id}" ${cur===n.id?'aria-current="page"':""}>${svg(n.icon,21)}<span>${n.label}</span></button>`).join("") +
    `<button class="tab" data-act="more" ${!tabs.some(t=>t.id===cur)&&cur!=="dashboard"?'aria-current="page"':""}>${svg("more",21)}<span>More</span></button>`;
}

function current(){ return (location.hash||"#dashboard").slice(1).split("?")[0]; }

function go(id){
  if(current()===id){ render(); return; }
  location.hash = "#"+id;
}

window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

function profileCompletion(){
  const a = DB.athlete;
  const checks = [a.first, a.school, a.sport, a.height, a.gpa, a.hometown,
                  a.bioLong, a.achievements.length, a.socials.length,
                  a.engagement, a.guardian.email, a.interests.length,
                  a.availability, a.audience, a.nickname];
  const filled = checks.filter(Boolean).length;
  return Math.round(filled/checks.length*100);
}

function fmt(iso){
  if(!iso || iso==="—") return "—";
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

  },
  "export-report"(){
    const rows = [["Source","Amount","Date"], ...DB.payments.map(p=>[p.src,p.amt,p.date])];
    const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    const a = document.createElement("a");
    a.href = url; a.download = "oma-earnings.csv"; a.click();
    URL.revokeObjectURL(url);
    closeModal(); toast("Report exported");
  },

  /* ---- brands ---- */
  "request-intro"(el){
    const name = el.dataset.id;
    openModal({
      title:"Request an introduction",
      body:`<p class="hint" style="margin-bottom:14px">Your agent will pitch you to ${esc(name)} directly. Tell her why you're a fit.</p>
      <div class="f"><label for="ri">Why you</label><textarea id="ri" placeholder="Their audience is my audience — 71% female, mostly 13–24."></textarea></div>`,
      foot:`<button class="btn" data-close>Cancel</button>
            <button class="btn btn-primary" data-act="request-intro-send" data-id="${esc(name)}">Send request</button>`
    });
  },
  "request-intro-send"(el){
    const b = DB.brands.find(x=>x.name===el.dataset.id);
    if(b && b.status==="Not contacted") b.status = "In progress";
    closeModal(); render(); toast("Request sent to Tasha");
  },
  "brand-profile"(el){
    const b = DB.brands.find(x=>x.name===el.dataset.id);
    const history = DB.outreach.filter(o=>o.brand===b.name);
    openModal({
      title:b.name,
      body:`<div class="record-top" style="margin-bottom:14px">
        <span class="brandmark ${b.cls}">${esc(b.mark)}</span>
        <span class="grow"><b>${esc(b.cat)}</b><small>${esc(b.status)}</small></span>
      </div>
      <p style="margin-bottom:16px">${esc(b.looks)}</p>
      <h4 style="font-size:14px;margin-bottom:9px">Your history</h4>
      ${history.length ? `<div class="rows">${history.map(h=>`
        <div class="row"><span class="grow"><b>${esc(fmt(h.sent))}</b><small>${esc(h.contact)}</small></span>
        <span class="chip ${statusClass(h.status)}">${esc(h.status)}</span></div>`).join("")}</div>`
        : `<p class="hint">No contact yet.</p>`}`,
      foot:`<button class="btn" data-close>Close</button>
            <button class="btn btn-primary" data-act="request-intro" data-id="${esc(b.name)}">Request an introduction</button>`
    });
  },

  /* ---- messages ---- */
  "send-msg"(){
    const box = $("#msg");
    const v = box.value.trim();
    if(!v) return;
    const now = new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    DB.messages.push({from:"me", text:v, at:now});
    render();
    const th = $("#thread"); if(th) th.scrollTop = th.scrollHeight;
    $("#msg").focus();
  },

  /* ---- settings ---- */
  "save-settings"(){ toast("Settings saved"); },
  "toggle-notif"(el){
    el.classList.toggle("done");
    el.setAttribute("aria-pressed", el.classList.contains("done"));
  }
};

/* ---- email drafting (template-based stand-in for the LLM) ---- */
function draftEmail(brand, tplId){
  const a = DB.athlete;
  const reach = compact(totalReach());
  const top = a.socials.slice().sort((x,y)=>y.followers-x.followers)[0];
  const b = DB.brands.find(x=>x.name===brand);

  const openers = {
    tp1:`Hi there,\n\nI'm ${a.first} ${a.last}, a ${a.grade.toLowerCase()} ${a.position.toLowerCase()} at ${a.school} in ${a.hometown}. I follow ${brand} closely and I think my audience is your audience.\n\nWhere I stand right now: ${reach} followers across four platforms, ${a.engagement} engagement, and an audience that's ${a.audience.toLowerCase()}. My strongest channel is ${top.net} at ${compact(top.followers)}.\n\n${a.bioShort}${b?` I noticed you look for ${b.looks.toLowerCase().replace(/\.$/,"")} — that's exactly where I sit.`:""}\n\nI've attached my media kit. If there's a fit, my guardian ${a.guardian.name} handles scheduling and can be reached at ${a.guardian.email}.\n\nThank you for the time,\n${a.first}`,

    tp2:`Hi again,\n\nFollowing up on my note about a partnership with ${brand} — I know inboxes get full.\n\nQuick recap: ${reach} total followers, ${a.engagement} engagement, ${a.audience.toLowerCase()}. Since I wrote, ${a.achievements[0].toLowerCase()}.\n\nHappy to send fresh content examples or hop on a 15-minute call. If the timing is wrong, just say so and I'll check back next season.\n\nThanks,\n${a.first}`,

    tp3:`Hi,\n\nThank you for making the time — I enjoyed the conversation.\n\nTo recap what we discussed: I'd cover the campaign across ${top.net} and my other channels, with content approval routed through ${a.guardian.name} before anything posts.\n\nI'll get you the draft concepts by the end of the week. Anything else you need from my side in the meantime, just ask.\n\nSpeak soon,\n${a.first}`,

    tp4:`Hi,\n\nGreat news — I'd like to move ahead with ${brand}.\n\nAs agreed, please send the agreement to my guardian ${a.guardian.name} at ${a.guardian.email}. She signs on my behalf since I'm ${a.age}. Operation Millionaire Athletes will review alongside her.\n\nOnce it's signed I can start on the deliverables straight away. My availability: ${a.availability}\n\nLooking forward to it,\n${a.first}`
  };
  return openers[tplId] || openers.tp1;
}

/* ============================================================
   7. EVENT WIRING
   ============================================================ */

document.addEventListener("click", e=>{
  const goEl = e.target.closest("[data-go]");
  if(goEl){ e.preventDefault(); closeModal(); go(goEl.dataset.go); return; }

  if(e.target.closest("[data-close]")){ closeModal(); return; }
  if(e.target.matches("[data-close-scrim]")){ closeModal(); return; }

  const actEl = e.target.closest("[data-act]");
  if(actEl){
    const fn = ACTIONS[actEl.dataset.act];
    if(fn){ e.preventDefault(); fn(actEl); }
  }
});

document.addEventListener("keydown", e=>{
  if(e.target.id==="msg" && e.key==="Enter" && !e.shiftKey){
    e.preventDefault(); ACTIONS["send-msg"]();
  }
});

document.addEventListener("input", e=>{
  if(e.target.id==="msg"){
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight,130)+"px";
  }
});

$("#search")?.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.value.trim()){
    toast(`Searching for "${e.target.value.trim()}"`);
  }
});

/* ---- boot ---- */
if(!location.hash) location.hash = "#dashboard";
render();
</script>
